<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer-Stream 控制台</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'><rect width='1' height='1' fill='coral'/></svg>"
    />
    <link rel="stylesheet" href="./signal.css" />
  </head>

  <body>
    <aside>
      <a
        href="./signal.json"
        target="_blank"
        download="signal.json"
        title="下载配置"
        icon="⬇️"
        aria-label="下载 signal.json"
      ></a>
      <a href="#signal.json" id="signal.json" title="系统配置" icon="⚙️" aria-label="系统配置"></a>
      <a href="#peer-stream" id="peer-stream" title="进入应用" icon="▶️" aria-label="进入应用"></a>
      <a href="#signal.js" id="signal.js" title="进程管理" icon="📊" aria-label="进程管理"></a>

      <div class="spacer"></div>

      <a
        href="https://github.com/inveta/peer-stream"
        target="_blank"
        rel="noopener"
        title="源码"
        icon="📦"
        aria-label="Github 源码"
      ></a>
      <button id="checkUpdate" title="检查更新" icon="🔍" onclick="handleCheckUpdate()" aria-label="检查更新"></button>
      <button id="themeToggle" title="主题" icon="🌙" onclick="toggleTheme()" aria-label="切换主题"></button>
    </aside>

    <main>
      <empty></empty>

      <form onchange="submitConfig(event)">
        <fieldset class="card span-all">
          <legend>🌐 网络设置</legend>
          <div class="fields">
            <inline>
              <label for="PORT">端口号</label>
              <input type="number" id="PORT" name="PORT" required />
            </inline>
            <inline>
              <label for="preload">预加载个数</label>
              <input type="number" name="preload" id="preload" required />
            </inline>
            <inline>
              <label for="exeUeCoolTime">实例冷却期 (秒)</label>
              <input type="number" name="exeUeCoolTime" id="exeUeCoolTime" required />
            </inline>
          </div>
        </fieldset>

        <fieldset class="card">
          <legend>🔒 访问认证</legend>
          <div class="fields">
            <label class="switch">
              <input type="checkbox" id="http-auth" name="http-auth" />
              <span>启用 HTTP 认证</span>
            </label>
            <inline class="auth-field wide">
              <label for="auth">用户名 : 密码</label>
              <input
                type="password"
                id="auth"
                name="auth"
                pattern="/^[a-zA-Z0-9]+:[a-zA-Z0-9]+$/"
                autocomplete="off"
                value="admin:000000"
                onblur="this.type='password'"
                onfocus="this.type='text'"
              />
            </inline>
          </div>
        </fieldset>

        <fieldset class="card">
          <legend>⚙️ 运行模式</legend>
          <div class="fields">
            <label class="switch">
              <input type="checkbox" id="one2one" name="one2one" />
              <span>一对一模式</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="boot" name="boot" />
              <span>开机自启动</span>
            </label>
            <label class="switch">
              <input type="checkbox" id="UEVersion" name="UEVersion" />
              <span>旧版 UE4 协议</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="card span-all">
          <legend>🎮 UE 启动参数</legend>
          <div class="fields">
            <inline class="wide">
              <label for="GPUFile">UE 启动文件（GPU 服务器中的绝对路径）</label>
              <input
                type="text"
                name="GPUFile"
                id="GPUFile"
                placeholder="例如：C:\Apps\MyApp\MyApp.exe"
              />
            </inline>
            <inline>
              <label for="resolution">分辨率</label>
              <input
                type="text"
                name="resolution"
                list="resolutionList"
                id="resolution"
                placeholder="如：1920*1080"
              />
              <datalist id="resolutionList">
                <option value="1920*1080"></option>
                <option value="1600*900"></option>
                <option value="1366*768"></option>
                <option value="1280*720"></option>
                <option value="800*600"></option>
                <option value="640*480"></option>
              </datalist>
            </inline>
            <inline>
              <label for="pixelStreamingWebRTCFps">渲染帧率</label>
              <input
                type="number"
                name="pixelStreamingWebRTCFps"
                id="pixelStreamingWebRTCFps"
                placeholder="如：30"
              />
            </inline>
            <inline id="GPU">
              <label for="GPUNumber">GPU 数量</label>
              <input type="number" name="GPUNumber" id="GPUNumber" placeholder="需要的 GPU 数量" />
            </inline>
            <!-- 每块 GPU 的进程承载量由 JS 动态插入在 #GPU 之后 -->
            <div class="toggle-row wide">
              <label class="switch">
                <input type="checkbox" name="unattended" id="unattended" />
                <span>忽略错误弹窗</span>
              </label>
              <label class="switch">
                <input type="checkbox" name="renderOffScreen" id="renderOffScreen" />
                <span>后台渲染</span>
              </label>
              <label class="switch">
                <input type="checkbox" name="audioMixer" id="audioMixer" />
                <span>传输音频</span>
              </label>
            </div>
          </div>
        </fieldset>

        <fieldset class="card span-all">
          <legend>🧊 高级设置</legend>
          <div class="fields">
            <text-area class="wide">
              <label for="iceServers">ICE 服务器（STUN / TURN，JSON 格式）</label>
              <textarea id="iceServers" name="iceServers"></textarea>
            </text-area>
            <text-area class="wide">
              <label for="comment">备注</label>
              <textarea id="comment" name="comment"></textarea>
            </text-area>
          </div>
        </fieldset>
      </form>

      <video is="peer-stream" ui onplaying="getStats()">
        <track default kind="captions" srclang="en" />
      </video>

      <section class="dashboard">
        <div class="stat-cards">
          <div class="stat"><span class="stat-value" data-stat="players">0</span><span class="stat-label">在线用户</span></div>
          <div class="stat"><span class="stat-value" data-stat="engines">0</span><span class="stat-label">UE 实例</span></div>
          <div class="stat"><span class="stat-value" data-stat="freeUe">0</span><span class="stat-label">空闲实例</span></div>
          <div class="stat"><span class="stat-value" data-stat="agents">0</span><span class="stat-label">启动代理</span></div>
          <div class="stat"><span class="stat-value" data-stat="queued">0</span><span class="stat-label">排队中</span></div>
          <div class="stat"><span class="stat-value" data-stat="uptime">—</span><span class="stat-label">运行时长</span></div>
        </div>

        <div class="dash-toolbar">
          <button type="button" onclick="adminCmd('startUe')">▶️ 启动 UE 实例</button>
          <button type="button" onclick="adminCmd('refresh')">🔄 刷新</button>
        </div>

        <table onclick="tableClick(event)">
          <thead>
            <tr>
              <th>进程</th>
              <th>IP地址</th>
              <th>端口号</th>
              <th>路径</th>
              <th>在线时长</th>
              <th>玩家数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="log-panel">
          <header>服务器日志</header>
          <pre class="logs" data-logs></pre>
        </div>
      </section>
    </main>

    <div id="toast-container"></div>

    <script src="./signal-ui.js"></script>
  </body>
</html>
